<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><title>Exportar HTML de referencia</title>
<link rel="stylesheet" href="../_ds/nocturne-0a52cd25-5dbf-4508-9376-688d61ebb35a/styles.css">
<style>body{background:#161826;color:#e9e9ed;font-family:Inter,system-ui,sans-serif;margin:0;padding:32px;display:flex;flex-direction:column;gap:16px;max-width:820px}a{color:#9184d9}iframe{width:1280px;height:900px;border:0;position:absolute;left:-9999px;top:0}pre{font-size:12px;color:#9397ab;white-space:pre-wrap;margin:0}</style>
</head><body>
<h1 style="font-size:25px;font-weight:500;margin:0;letter-spacing:-.015em">HTML de referencia por vista</h1>
<p style="margin:0;color:#b2b6ca;font-size:14px;max-width:640px">Genera un archivo estático por vista a partir del prototipo (mismo DOM, estilos inline resueltos, datos de ejemplo). Cada archivo enlaza <code>nocturne.css</code> y <code>pico-map.css</code>. Salida: un .zip para pasar a Claude Code.</p>
<div style="display:flex;gap:8px"><button id="go" class="btn btn-primary">Generar zip</button><a class="btn btn-secondary" href="../Prototipo Estudio Contable.dc.html">Ver prototipo</a></div>
<pre id="log"></pre>
<iframe id="fr"></iframe>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<script>
const VIEWS=[
 ['01-dashboard','dashboard',{},'01 · Dashboard (F9)'],
 ['02-clientes','clientes',{},'02 · Listado de clientes (F1)'],
 ['03-cobros','cobros',{},'03 · Vista global de cobros (F5)'],
 ['04-tareas','tareas',{},'04 · Tareas del período (F7)'],
 ['05-calendario','calendario',{},'05 · Calendario de vencimientos (F8)'],
 ['06-recordatorios','dashboard',{bell:true},'06 · Panel de recordatorios (F10)'],
 ['07-ficha-datos','ficha',{tab:'datos'},'07 · Ficha: datos generales + regímenes (F1)'],
 ['08-ficha-servicios','ficha',{tab:'servicios',finalizados:true},'08 · Ficha: servicios contratados (F4)'],
 ['09-ficha-credenciales','ficha',{tab:'credenciales',cred:2,reveal:{2:true}},'09 · Ficha: vault de credenciales (F2)'],
 ['10-ficha-estado-cuenta','ficha',{tab:'cuenta'},'10 · Ficha: estado de cuenta (F5)'],
 ['11-ficha-honorarios','ficha',{tab:'honorarios'},'11 · Ficha: historial de honorarios (F6)'],
 ['12-ficha-vencimientos','ficha',{tab:'vencimientos'},'12 · Ficha: próximos vencimientos (F8)'],
 ['13-form-cliente','ficha',{form:'cliente',regCambio:true},'13 · Crear/editar cliente + cambio de régimen (F1)'],
 ['14-form-credencial','ficha',{tab:'credenciales',form:'credencial',attempt:true},'14 · Crear/editar credencial (F2)'],
 ['15a-form-contratar','ficha',{tab:'servicios',form:'contratar',servSel:'Liquidación mensual'},'15a · Contratar servicio (F4)'],
 ['15b-form-finalizar','ficha',{tab:'servicios',form:'finalizar'},'15b · Finalizar servicio (F4)'],
 ['16a-form-cobro','cobros',{form:'cobro',cobroServ:'unico'},'16a · Registrar cobro (F5)'],
 ['16b-form-descuento','ficha',{tab:'cuenta',form:'descuento'},'16b · Registrar descuento (F5)'],
 ['17-form-honorario','ficha',{tab:'servicios',form:'honorario',hVig:'2026-07-01'},'17 · Cambio individual de honorario (F6)'],
 ['18a-aumento-paso1','aumento',{paso:1},'18a · Aumento global — paso 1 (F6)'],
 ['18b-aumento-paso2','aumento',{paso:2,sel:{1:true,2:true,4:true,8:true,9:true},manual:{8:'7600'}},'18b · Aumento global — paso 2 (F6)'],
 ['18c-aumento-paso3','aumento',{paso:3,sel:{1:true,2:true,4:true,8:true,9:true}},'18c · Aumento global — paso 3 (F6)'],
 ['18d-aumento-listo','aumento',{done:true,sel:{1:true,2:true}},'18d · Aumento global — confirmado (F6)'],
 ['19-form-tarea-adhoc','tareas',{form:'adhoc'},'19 · Crear tarea ad-hoc (F7)'],
 ['20-config-servicios','config',{cfg:'servicios'},'20 · Configuración: servicios (F3)'],
 ['20b-form-servicio','config',{cfg:'servicios',form:'servicio'},'20b · Editar servicio (F3)'],
 ['21-config-templates','config',{cfg:'templates'},'21 · Configuración: templates de tareas (F7)'],
 ['21b-form-template','config',{cfg:'templates',form:'template',tplAnual:true},'21b · Nuevo template (F7)'],
 ['22-config-vencimientos','config',{cfg:'vencimientos'},'22 · Configuración: vencimientos (F8)'],
 ['22b-form-vencimiento','config',{cfg:'vencimientos',form:'vencimiento'},'22b · Nuevo vencimiento (F8)'],
 ['23-config-notificaciones','config',{cfg:'notificaciones'},'23 · Configuración: notificaciones (F10)'],
 ['24a-historico','finanzas',{fin:'historico'},'24a · Histórico mensual (F9)'],
 ['24b-proyeccion','finanzas',{fin:'proyeccion'},'24b · Proyección (F9)'],
 ['25-gastos-ingresos','gastos',{},'25 · Gastos e ingresos propios (F9)'],
 ['25b-form-gasto','gastos',{form:'gasto'},'25b · Nuevo gasto/ingreso (F9)'],
 ['26-login','login',{},'26 · Login (E0)'],
 ['m01-dashboard','dashboard',{},'Móvil · Dashboard',true],
 ['m03-cobros','cobros',{},'Móvil · Cobros',true],
 ['m04-tareas','tareas',{},'Móvil · Tareas',true],
 ['m09-vault','ficha',{cred:1},'Móvil · Vault de credenciales',true],
 ['m16-cobro','cobros',{form:'cobro'},'Móvil · Registrar cobro',true],
];
const $=s=>document.querySelector(s);const logEl=$('#log');const L=t=>{logEl.textContent+=t+'\n'};
const wait=ms=>new Promise(r=>setTimeout(r,ms));
function findComp(doc){const el=doc.querySelector('[data-screen-label]')||doc.querySelector('aside')||doc.body.firstElementChild;let f=null;for(const k in el){if(k.startsWith('__reactFiber')){f=el[k];break}}while(f){if(f.stateNode&&f.stateNode.renderVals)return f.stateNode;f=f.return}return null}
async function loadProto(mobile){const fr=$('#fr');fr.src='../Prototipo Estudio Contable.dc.html'+(mobile?'?pantalla=m%C3%B3vil':'');await new Promise(r=>fr.onload=r);for(let i=0;i<60;i++){await wait(150);const d=fr.contentDocument;if(d&&d.querySelector('[data-screen-label]')&&findComp(d))return fr.contentWindow}throw new Error('prototipo no cargó')}
function clean(root){root.querySelectorAll('script,helmet').forEach(n=>n.remove());root.querySelectorAll('*').forEach(n=>{[...n.attributes].forEach(a=>{if(/^data-(cc|dm|react)/.test(a.name)||a.name.startsWith('data-comment')||a.name==='data-om-raster')n.removeAttribute(a.name)})})}
const shell=(title,body,mobile)=>`<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>${title} — Estudio Contable</title>
<!-- Referencia visual generada desde el prototipo (Etapa 1). Pico.css es la base; nocturne.css y pico-map.css la tematizan. -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
<link rel="stylesheet" href="./nocturne.css">
<link rel="stylesheet" href="./pico-map.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
</head><body${mobile?' class="movil"':''}>
${body}
</body></html>`;
$('#go').onclick=async()=>{
 $('#go').disabled=true;const zip=new JSZip();const dir=zip.folder('referencia-html');
 const noct=await (await fetch('../_ds/nocturne-0a52cd25-5dbf-4508-9376-688d61ebb35a/styles.css')).text();
 dir.file('nocturne.css',noct);dir.file('pico-map.css',await (await fetch('pico-map.css')).text());
 let index='';let win=null,curMobile=null;
 for(const [file,view,state,title,mobile=false] of VIEWS){
  if(!win||curMobile!==mobile){win=await loadProto(mobile);curMobile=mobile}
  const comp=findComp(win.document);
  const base={view,bell:false,sil:null,form:null,attempt:false,regCambio:false,servSel:'',hVig:'2026-10-01',paso:1,done:false,sel:{},manual:{},cred:null,reveal:{},finalizados:false,tab:'datos',cfg:'servicios',fin:'historico',tplAnual:false,cobroServ:'mensual'};
  comp.setState({...base,...state});await wait(350);
  const doc=win.document;const root=doc.querySelector('x-dc')||doc.body;const clone=root.cloneNode(true);clean(clone);
  const body=[...clone.children].map(c=>c.outerHTML).join('\n');
  dir.file(file+'.html',shell(title,body,mobile));
  index+=`<li><a href="${file}.html">${title}</a></li>\n`;L('✓ '+file);
 }
 const readme=await (await fetch('README.md')).text();
 dir.file('README.md',readme);
 dir.file('index.html',shell('Índice',`<main style="max-width:720px;margin:0 auto;padding:40px 24px"><h1 style="font-size:25px;font-weight:500;letter-spacing:-.015em">HTML de referencia — Estudio Contable</h1><p style="color:#9397ab;font-size:14px">${VIEWS.length} archivos. Ver README.md para el mapeo Pico ↔ Nocturne.</p><ul style="line-height:1.9;font-size:14px">${index}</ul></main>`));
 const blob=await zip.generateAsync({type:'blob'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='referencia-html.zip';a.click();L('Listo: referencia-html.zip');$('#go').disabled=false;
};
</script></body></html>
